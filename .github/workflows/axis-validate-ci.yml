name: axis-validate tests

on: [push, pull_request]

jobs:
  with-jsonschema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r .agents/skills/axis-engineering/scripts/requirements.txt
      - run: python .agents/skills/axis-engineering/scripts/test_axis_validate.py
      - name: Validate shipped example (strict)
        run: |
          python .agents/skills/axis-engineering/scripts/axis-validate.py \
            .agents/skills/axis-engineering/assets/review-example.json \
            --repo-path .agents/skills/axis-engineering \
            --require-schema

  without-jsonschema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # deliberately do NOT install jsonschema — suite must stay green by skipping, not failing
      - run: python .agents/skills/axis-engineering/scripts/test_axis_validate.py
